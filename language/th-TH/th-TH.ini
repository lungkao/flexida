GRAFIDA_MSG_CONTENT_NORMALISATION_INFO="ข้อความที่ AI เขียนหรือเรียบเรียงใหม่มักมีอักขระที่มองไม่เห็น เช่น ช่องว่างความกว้างศูนย์ เครื่องหมายบอกทิศทาง อักขระแท็ก และการจัดรูปแบบที่มองไม่เห็นอื่นๆ บางส่วนเป็นลายน้ำที่ตั้งใจใส่ บางส่วนติดมาจากการคัดลอกจากหน้าเว็บ ไม่ว่าอย่างใด โปรแกรมอ่านหน้าจอจะอ่านออกเสียงมันด้วย และมันอาจทำให้ลำดับการอ่านของประโยคกลับด้านหรือทำให้การค้นหาในหน้าใช้ไม่ได้ Grafida ลบสิ่งเหล่านี้ออกจากคำตอบของ AI, Markdown ที่นำเข้า, ข้อความที่วางเป็นข้อความธรรมดา และจากชื่อเรื่อง เนื้อหา และข้อมูลเมตาของทุกบทความที่คุณเผยแพร่ อักขระที่มีความหมายจะถูกเก็บไว้ เช่น ตัวที่ยึดลำดับอีโมจิไว้ด้วยกัน และตัวเชื่อมที่ภาษาเปอร์เซีย อาหรับ และอักษรอินเดียต้องใช้ เลือก เฉพาะเครื่องหมายที่มองไม่เห็น หากคุณเขียนโดยใช้ช่องว่างแบบเรียงพิมพ์ เช่น ช่องว่างไม่ตัดบรรทัดก่อนเครื่องหมายวรรคตอนของภาษาฝรั่งเศส หรือช่องว่างแบบอุดมคติของภาษาญี่ปุ่น เลือก ปิด หากคุณใส่เครื่องหมายบอกทิศทางไว้โดยตั้งใจด้วย อย่างที่ข้อความจากขวาไปซ้ายบางครั้งต้องทำ"
